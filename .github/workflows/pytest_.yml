name: Run Python Tests

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies and Run pytest
      run: |
        python -m pip install --upgrade pip
        cd Python/pytest_
        pip install -r requirements.txt
        pytest && python app/decorator.py && pytest -m slow
        # python3 -m pytest && python3 app/decorator.py && python3 -m pytest -m slow -> locally

    - name: Install dependencies and Run Cucumber with behave and pytest_bdd
      run: |
        python -m pip install --upgrade pip
        cd Python/cucumber_
        pip install behave requests pytest pytest-bdd
        behave
        # behave -> locally
        pytest
        # python3 -m pytest -> locally

    - name: Python Jupyter console
      run: |
        pip install jupyter jupyter_client jupyter-console

        jupyter-console --kernel=python3 <<EOF
        print("Hello from Python inline!")

        # Print Python runtime metadata
        import sys
        print("Python version: " + sys.version)
        print("Python platform: " + sys.platform)
        print("Python home: " + sys.prefix)
        EOF

    - name: Python IPython (-c flag)
      run: |
        pip install ipython

        ipython -c 'print("Hello from IPython inline!"); import sys; print("Python version: " + sys.version); print("Python platform: " + sys.platform); print("Python home: " + sys.prefix)'

    - name: Python IPython (heredoc)
      run: |
        pip install ipython

        ipython <<EOF
        print("Hello from IPython inline again!")

        # Print Python runtime metadata
        import sys
        print("Python version: " + sys.version)
        print("Python platform: " + sys.platform)
        print("Python home: " + sys.prefix)
        EOF

    # -----------------------------------------------------------------------
    # TypeScript / JavaScript inline-execution variants
    # -----------------------------------------------------------------------

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install local ts-node and typescript; install tsx and bun
      run: |
        npm init -y
        # Install ts-node and typescript as local devDependencies (reproducible)
        npm install --no-audit --no-fund --save-dev ts-node typescript
    
        # Keep tsx globally available if you prefer the global binary (optional)
        npm install -g tsx
    
        # Install bun (keeps your existing bun steps working)
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> $GITHUB_PATH

    # ---------- ts-node ----------

    - name: ts-node <file.ts>
      run: |
        cat > /tmp/hello_tsnode.ts <<'EOF'
        const msg: string = "Hello from ts-node file!";
        console.log(msg);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        console.log("Arch: "         + process.arch);
        EOF
    
        npx ts-node --transpile-only /tmp/hello_tsnode.ts
        
    - name: ts-node <file.ts>  (file run via node -r register/transpile-only)
      run: |
        cat > /tmp/hello_tsnode.ts <<'EOF'
        const msg: string = "Hello from ts-node file (register)!";
        console.log(msg);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        EOF
    
        # Require the local transpile-only register to avoid ts.sys bootstrap
        node -r ./node_modules/ts-node/register/transpile-only /tmp/hello_tsnode.ts
            
    - name: ts-node -e  (inline expression)
      run: |
        TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' \
          ts-node --cwd /tmp -e 'const msg: string = "Hello from ts-node -e!"; console.log(msg); console.log("Node version: " + process.version); console.log("Platform: " + process.platform);'

    - name: ts-node -p  (print expression value)
      run: |
        TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' \
          ts-node --cwd /tmp -p -e '`ts-node -p :: ${process.version} on ${process.platform}`'

    - name: ts-node <<EOF  (stdin heredoc)
      run: |
        TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' \
          ts-node --cwd /tmp <<'EOF'
        const greeting: string = "Hello from ts-node heredoc!";
        console.log(greeting);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        const nums: number[] = [1, 2, 3, 4, 5];
        console.log("Sum: " + nums.reduce((a, b) => a + b, 0));
        EOF

    - name: ts-node via shell pipe  (echo | ts-node)
      run: |
        echo 'const msg: string = "Hello from ts-node via pipe!"; console.log(msg);' \
          | TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' ts-node --cwd /tmp

    # ---------- tsx ----------

    - name: tsx <file.ts>  (file run)
      run: |
        cat > /tmp/hello_tsx.ts <<'EOF'
        const msg: string = "Hello from tsx file!";
        console.log(msg);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        EOF
        tsx /tmp/hello_tsx.ts

    # ---------- bun ----------

    - name: bun run <file.ts>  (file run)
      run: |
        cat > /tmp/hello_bun.ts <<'EOF'
        const msg: string = "Hello from bun file!";
        console.log(msg);
        console.log("Bun version: "  + Bun.version);
        console.log("Platform: "     + process.platform);
        EOF
        bun run /tmp/hello_bun.ts

    - name: bun -e  (inline expression)
      run: |
        bun -e 'const msg: string = "Hello from bun -e!"; console.log(msg); console.log("Bun version: " + Bun.version);'

    - name: bun --print  (print expression value)
      run: |
        bun --print '`bun --print :: Bun ${Bun.version} on ${process.platform}`'

    - name: bun -  (read program from stdin via heredoc)
      run: |
        bun - <<'EOF'
        const greeting: string = "Hello from bun stdin heredoc!";
        console.log(greeting);
        console.log("Bun version: " + Bun.version);
        console.log("Platform: "    + process.platform);
        EOF

    # -----------------------------------------------------------------------
    # Python additional inline-execution variants
    # -----------------------------------------------------------------------

    - name: python -m  (module flag — runs a stdlib module as __main__)
      run: |
        python -m timeit -n 1000 -s 'x = list(range(100))' 'sum(x)'
        python -m platform
        python -m site

    - name: echo | python  (piped REPL stdin)
      run: |
        echo 'import sys; print("Hello from python via pipe!"); print("Python version: " + sys.version)' | python

    # -----------------------------------------------------------------------
    # Node.js / JavaScript inline-execution variants
    # (Node was installed earlier alongside ts-node / tsx / bun)
    # -----------------------------------------------------------------------

    - name: node <file.js>  (file run)
      run: |
        cat > /tmp/hello_node.js <<'EOF'
        const msg = "Hello from node file!";
        console.log(msg);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        console.log("Arch: "         + process.arch);
        EOF
        node /tmp/hello_node.js

    - name: node -e  (inline expression)
      run: |
        node -e 'const msg = "Hello from node -e!"; console.log(msg); console.log("Node version: " + process.version); console.log("Platform: " + process.platform);'

    - name: node -p  (print expression value)
      run: |
        node -p '`node -p :: ${process.version} on ${process.platform}`'

    - name: node - <<EOF  (stdin heredoc via process substitution)
      run: |
        node - <<'EOF'
        const greeting = "Hello from node stdin heredoc!";
        console.log(greeting);
        console.log("Node version: " + process.version);
        console.log("Platform: "     + process.platform);
        EOF

    - name: echo | node  (piped REPL stdin)
      run: |
        echo 'console.log("Hello from node via pipe! Node " + process.version)' | node -

    - name: node --check  (syntax-check a JS file without running it)
      run: |
        node --check /tmp/hello_node.js && echo "Syntax OK"

    # -----------------------------------------------------------------------
    # Java inline / single-file / JShell execution variants
    # -----------------------------------------------------------------------

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: jshell - <<EOF  (stdin heredoc)
      run: |
        jshell - <<'EOF'
        System.out.println("Hello from jshell heredoc!");
        System.out.println("Java version: " + System.getProperty("java.version"));
        int[] nums = {1, 2, 3, 4, 5};
        int sum = java.util.Arrays.stream(nums).sum();
        System.out.println("Sum: " + sum);
        /exit
        EOF

    - name: echo | jshell  (piped REPL stdin)
      run: |
        printf '%s\n' 'System.out.println("Hello from jshell via pipe! Java " + System.getProperty("java.version"));' '/exit' | jshell -

    - name: jshell <file.jsh>  (script file)
      run: |
        cat > /tmp/hello.jsh <<'EOF'
        System.out.println("Hello from jshell file!");
        System.out.println("Java version: " + System.getProperty("java.version"));
        /exit
        EOF
        jshell /tmp/hello.jsh

    # -----------------------------------------------------------------------
    # ClojureScript inline / file execution via nbb (Node-hosted)
    # -----------------------------------------------------------------------

    - name: Install nbb (ClojureScript on Node)
      run: |
        npm install -g nbb

    - name: nbb -e  (inline ClojureScript expression)
      run: |
        nbb -e '(println "Hello from nbb -e!") (println (str "Node: " js/process.version))'

    - name: nbb <file.cljs>  (file run)
      run: |
        cat > /tmp/hello.cljs <<'EOF'
        (println "Hello from nbb <file.cljs>!")
        (println (str "Node: " js/process.version))
        (println (str "Platform: " js/process.platform))
        (println (str "Sum: " (reduce + [1 2 3 4 5])))
        EOF
        nbb /tmp/hello.cljs

    - name: node child_process.spawn/exec("node", ...) from JS  (javascript.md §9.2)
      run: |
        node -e "require('child_process').spawn('node',['-e','console.log(2+3)']).stdout.pipe(process.stdout)"
        node -e "require('child_process').exec('node -e \"console.log(42)\"', (e,o)=>process.stdout.write(o))"

    - name: node child_process.execFile -> perl -e  (perl.md §3.1)
      run: |
        node -e "require('child_process').execFile('perl',['-e','print \"hi from perl-via-node\\n\"'],(e,o)=>process.stdout.write(o))"

    - name: go -> node -e -> perl -e  (perl.md §3.2 — nested polyglot)
      run: |
        cat > /tmp/g2np.go <<'EOF'
        package main
        import ("os/exec"; "os")
        func main() {
            out, _ := exec.Command("node", "-e", `require('child_process').execFile('perl',['-e','print "hi from go-via-node-via-perl\n"'],(e,o)=>process.stdout.write(o))`).Output()
            os.Stdout.Write(out)
        }
        EOF
        go run /tmp/g2np.go

    - name: rust Command -> python -c  (rust.md §5.2)
      run: |
        cat > /tmp/r2py.rs <<'EOF'
        use std::process::{Command, Stdio};
        fn main() {
            let out = Command::new("python3")
                .args(&["-c", "print('hi from python-via-rust', 2+2)"])
                .stdout(Stdio::piped())
                .output()
                .expect("failed");
            print!("{}", String::from_utf8_lossy(&out.stdout));
        }
        EOF
        rustc -O /tmp/r2py.rs -o /tmp/r2py
        /tmp/r2py | tee /tmp/r2py.out
        grep -F 'hi from python-via-rust 4' /tmp/r2py.out

    - name: ts-node <file.ts> -> child_process.exec("node -e …")  (typescript.md §6.1)
      run: |
        cat > /tmp/ts_cp_exec.ts <<'EOF'
        import { exec } from 'child_process';
        exec(`node -e "console.log(2 + 3)"`, (_e, stdout) => process.stdout.write(stdout));
        EOF
        TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' ts-node /tmp/ts_cp_exec.ts | tee /tmp/ts_cp_exec.out
        grep -F '5' /tmp/ts_cp_exec.out
